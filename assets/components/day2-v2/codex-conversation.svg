<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F7F7F7"/><rect x="0" width="1280" height="92" fill="#0B0B0B"/>
  <g font-family="NanumGothic,Arial"><text x="54" y="58" font-size="30" font-weight="700" fill="#FFF">Codex와 대화하는 순서</text>
  <rect x="54" y="132" width="548" height="112" rx="10" fill="#FFF" stroke="#B9B9B9"/><text x="82" y="170" font-size="16" font-weight="700" fill="#2F6BFF">01 · 상황</text><text x="82" y="207" font-size="19" fill="#111">Meet·ClovaNote·녹음 세 입력을 지원하려고 해.</text>
  <rect x="678" y="132" width="548" height="112" rx="10" fill="#0B0B0B"/><text x="706" y="170" font-size="16" font-weight="700" fill="#8FB3FF">CODEX · 먼저 확인</text><text x="706" y="207" font-size="19" fill="#FFF">현재 코드·test·입력 계약을 먼저 찾을게요.</text>
  <rect x="54" y="272" width="548" height="112" rx="10" fill="#FFF" stroke="#B9B9B9"/><text x="82" y="310" font-size="16" font-weight="700" fill="#2F6BFF">02 · 작은 목표</text><text x="82" y="347" font-size="19" fill="#111">TranscriptEnvelope과 빈 TXT Error Test만 먼저 만들어줘.</text>
  <rect x="678" y="272" width="548" height="112" rx="10" fill="#0B0B0B"/><text x="706" y="310" font-size="16" font-weight="700" fill="#8FB3FF">CODEX · DIFF + TEST</text><text x="706" y="347" font-size="19" fill="#FFF">허용 파일 2개만 변경하고 focused test를 실행했어요.</text>
  <rect x="54" y="412" width="548" height="112" rx="10" fill="#FFF" stroke="#B9B9B9"/><text x="82" y="450" font-size="16" font-weight="700" fill="#2F6BFF">03 · Expected Error</text><text x="82" y="487" font-size="19" fill="#111">Fixture와 Live STT 입력 혼합 차단 Test를 추가해줘.</text>
  <rect x="678" y="412" width="548" height="112" rx="10" fill="#0B0B0B"/><text x="706" y="448" font-size="16" font-weight="700" fill="#8FB3FF">CODEX · EXPECTED ERROR</text><text x="706" y="480" font-size="18" fill="#FFF">SOURCE_MODE_MIXING_FORBIDDEN · HOLD</text><text x="706" y="507" font-size="17" fill="#FFF">Raw Traceback 숨김</text>
  <rect x="54" y="552" width="1172" height="100" rx="10" fill="#EAF1FF"/><text x="82" y="591" font-size="20" font-weight="700" fill="#111">04 · Independent Review → Human Merge Decision</text><text x="82" y="625" font-size="17" fill="#555">다른 Session의 누락·권한 검토 · Test 통과도 자동 Merge가 아닌 사람 판단의 입력</text></g>
