name: course-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-day1.txt
            desktop-app/meeting-intelligence/requirements.txt

      - name: Install course and desktop dependencies
        run: |
          python -m pip install -r requirements-day1.txt
          python -m pip install -r desktop-app/meeting-intelligence/requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Check whitespace errors
        run: git diff --check

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: desktop-app/meeting-intelligence/go.mod

      - name: Run desktop launcher tests
        working-directory: desktop-app/meeting-intelligence
        run: go test ./...
