name: day1-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Day 1 dependencies
        run: python -m pip install -r requirements-day1.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Check whitespace errors
        run: git diff --check
